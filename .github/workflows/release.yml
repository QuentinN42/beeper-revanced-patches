name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Make sure the release step uses its own credentials:
          # https://github.com/cycjimmy/semantic-release-action#private-packages
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v2

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          # The patches gradle plugin resolves app.revanced artifacts from
          # GitHub Packages; its "githubPackages" repository needs credentials
          # passed as Gradle properties.
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build clean -PgithubPackagesUsername="$GITHUB_PACKAGES_USERNAME" -PgithubPackagesPassword="$GITHUB_PACKAGES_PASSWORD"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ vars.GPG_FINGERPRINT }}

      # Gradle invokes gpg headlessly for signing the patches publication.
      # The import action already presets the passphrase for the master keygrip;
      # preset it for ALL keygrips (incl. the signing subkey) and instrument gpg
      # so the exact invocation appears in the log if something still fails.
      - name: Cache GPG passphrase for all keygrips
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          HEXPASS=$(printf '%s' "$GPG_PASSPHRASE" | xxd -p -u | tr -d '\n')
          for grip in $(gpg --list-secret-keys --with-colons --with-keygrip | awk -F: '/^grp/{print $10}'); do
            if gpg-connect-agent "PRESET_PASSPHRASE ${grip} -1 ${HEXPASS}" /bye 2>&1 | tee /dev/stderr | grep -q '^OK'; then
              echo "preset ok: $grip"
            else
              echo "::warning::preset failed for grip $grip"
            fi
          done

      - name: Instrument gpg with logging wrapper
        run: |
          mkdir -p "$HOME/debug-bin"
          cat > "$HOME/debug-bin/gpg" <<'EOS'
          #!/usr/bin/env bash
          printf 'GPG-CALL:%s\n' "$*" >> /tmp/gpg-wrapper.log 2>/dev/null || true
          exec /usr/bin/gpg "$@"
          EOS
          chmod +x "$HOME/debug-bin/gpg"
          echo "$HOME/debug-bin" >> "$GITHUB_PATH"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec semantic-release

      - name: Show gpg invocations
        if: always()
        run: cat /tmp/gpg-wrapper.log 2>/dev/null || echo "no gpg invocation logged"
