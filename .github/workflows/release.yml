name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Make sure the release step uses its own credentials:
          # https://github.com/cycjimmy/semantic-release-action#private-packages
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v2

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build clean

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ vars.GPG_FINGERPRINT }}

      # Gradle invokes gpg headlessly for signing the patches publication;
      # pre-seed the passphrase into gpg-agent's cache so no pinentry/TTY is needed.
      - name: Cache GPG passphrase
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          touch ~/.gnupg/gpg-agent.conf ~/.gnupg/gpg.conf
          python3 - <<'EOF'
          conf = open('/home/runner/.gnupg/gpg-agent.conf').read()
          for opt in ('allow-preset-passphrase','default-cache-ttl 3600'):
              if opt not in conf:
                  open('/home/runner/.gnupg/gpg-agent.conf','a').write(opt+'\n')
          gpgconf_conf = open('/home/runner/.gnupg/gpg.conf').read()
          if 'pinentry-mode loopback' not in gpgconf_conf:
              open('/home/runner/.gnupg/gpg.conf','a').write('pinentry-mode loopback\n')
          EOF
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          PRESET=$(find /usr/lib/x86_64-linux-gnu/gnupg /usr/lib/gnupg -name gpg-preset-passphrase 2>/dev/null | head -1)
          echo "preset tool: $PRESET"
          for grip in $(gpg --list-secret-keys --with-colons --with-keygrip | awk -F: '/^grp/{print $10}'); do
            preset_result=$(echo "$GPG_PASSPHRASE" | "$PRESET" "$grip" 2>&1) && echo "preset ok: $grip" || echo "preset failed: $grip: $preset_result"
          done

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec semantic-release
